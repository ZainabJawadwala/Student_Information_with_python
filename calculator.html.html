<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app calculator">
        <h1>Calculator</h1>
        <input type="text" class="calculator-screen" value="0" readonly>
        <table>
            <tr>
                <td><button class="btn operator" onclick="press('C')">C</button></td>
                <td><button class="btn operator" onclick="pressSign()">+/-</button></td>
                <td><button class="btn operator" onclick="press('%')">%</button></td>
                <td><button class="btn operator" onclick="press('/')">/</button></td>
            </tr>
            <tr>
                <td><button class="btn" onclick="press('7')">7</button></td>
                <td><button class="btn" onclick="press('8')">8</button></td>
                <td><button class="btn" onclick="press('9')">9</button></td>
                <td><button class="btn operator" onclick="press('*')">*</button></td>
            </tr>
            <tr>
                <td><button class="btn" onclick="press('4')">4</button></td>
                <td><button class="btn" onclick="press('5')">5</button></td>
                <td><button class="btn" onclick="press('6')">6</button></td>
                <td><button class="btn operator" onclick="press('-')">-</button></td>
            </tr>
            <tr>
                <td><button class="btn" onclick="press('1')">1</button></td>
                <td><button class="btn" onclick="press('2')">2</button></td>
                <td><button class="btn" onclick="press('3')">3</button></td>
                <td><button class="btn operator" onclick="press('+')">+</button></td>
            </tr>
            <tr>
                <td colspan="2"><button class="btn large" onclick="press('0')">0</button></td>
                <td><button class="btn" onclick="press('.')">.</button></td>
                <td><button class="btn operator" onclick="press('=')">=</button></td>
            </tr>
        </table>
    </div>

        <script>
        function press(val) {
            const screen = document.querySelector('.calculator-screen');
            if (!screen) return;
            const last = screen.value.slice(-1);
            const ops = ['+','-','*','/'];

            if (val === 'C') { 
                screen.value = '0';
                return;
            }

            if (val === '=') {
                try {
                    // sanitize: allow digits, operators, parentheses, dot and percent
                    const expr = screen.value.replace(/[^0-9+\-*/().% ]/g,'');
                    // convert percentages like 50% -> (50/100)
                    const normalized = expr.replace(/(\d+(?:\.\d+)?)%/g, '($1/100)');
                    const result = Function('return ' + normalized)();
                    screen.value = String(result);
                } catch (e) {
                    screen.value = 'Error';
                }
                return;
            }

            if (val === '%') {
                screen.value += '%';
                return;
            }

            if (ops.includes(val)) {
                if (ops.includes(last)) {
                    screen.value = screen.value.slice(0, -1) + val; // replace operator
                } else {
                    screen.value += val;
                }
                return;
            }

            if (screen.value === '0' && val !== '.') {
                screen.value = val;
            } else {
                screen.value += val;
            }
        }

        function pressSign() {
            const screen = document.querySelector('.calculator-screen');
            if (!screen) return;
            if (screen.value === '0') return;
            if (screen.value.startsWith('-')) {
                screen.value = screen.value.slice(1);
            } else {
                screen.value = '-' + screen.value;
            }
        }
        </script>
</body>
</html>
